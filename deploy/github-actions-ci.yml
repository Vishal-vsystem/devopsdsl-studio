name: DevOpsDSL CI/CD Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-compiler-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Compiler Unit Tests
        run: node tests/test_compiler.js
      - name: Install Pytest & Verify Server API
        run: |
          pip install -r requirements.txt
          pytest -v tests/test_server.py
      - name: Verify Docker Container Build
        run: docker build -t devopsdsl-studio:ci .
