version: '3.8'

services:
  devopsdsl-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devopsdsl-studio
    restart: unless-stopped
    environment:
      - PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - devopsdsl_snapshots:/app/web_portal/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: devopsdsl-edge-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      devopsdsl-app:
        condition: service_healthy

volumes:
  devopsdsl_snapshots:
